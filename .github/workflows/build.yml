name: Build CC Switch Magic

# 触发：仓库页面 → Actions → Build CC Switch Magic → Run workflow
# 也可在推送 magic-* tag 时自动出包
on:
  workflow_dispatch:
    inputs:
      version:
        description: "官方 tag（如 v3.20.1）。留空 = base.json 锁定的版本"
        required: false
        default: ""
        type: string
      make_release:
        description: "构建成功后创建 GitHub Release 并附上全部产物"
        required: false
        default: false
        type: boolean
      platforms:
        description: "构建哪些平台：全部 / Windows / Linux / macOS（可选多个，逗号分隔）"
        required: false
        default: "全部"
        type: string
  push:
    tags: ["magic-*"]

permissions:
  contents: write

jobs:
  # 先算出「要构建哪些平台」的矩阵。
  # 为什么单开一个 job：GitHub 的 job 级 if 里不能用 matrix，只能在矩阵展开前过滤。
  # push tag 触发时 inputs 为空 → 构建全部平台。
  plan:
    name: 规划平台
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          ALL='[{"os":"windows-latest","platform":"Windows","bundles":"nsis,msi"},{"os":"ubuntu-22.04","platform":"Linux","bundles":"deb,appimage"},{"os":"macos-14","platform":"macOS","bundles":"dmg"}]'
          SEL='${{ inputs.platforms }}'
          if [ -z "$SEL" ] || [ "$SEL" = "全部" ]; then
            MATRIX="$(echo "$ALL" | jq -c .)"
          else
            MATRIX="$(echo "$ALL" | jq -c --arg s "$SEL" '[.[] | select(.platform as $p | $s | contains($p))]')"
          fi
          echo "选中平台: $MATRIX"
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: 检出补丁层
        uses: actions/checkout@v4

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev rpm \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev


      - name: ① 组装：官方源码 + 补丁
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          # 直接具名调用（已验证）。不用 @a 数组 splat——它只按位置传参，
          # 会把版本号当命令名执行（报 "The module 'v3.20.1' could not be loaded"）
          if ([string]::IsNullOrWhiteSpace($v)) {
            ./scripts/apply.ps1 -TargetDir "${{ github.workspace }}/build"
          } else {
            ./scripts/apply.ps1 -TargetDir "${{ github.workspace }}/build" -Version $v
          }

      # 缓存 Rust 编译产物（关键优化）：必须放在「① 组装」之后，
      # 因为 target 目录要先存在，rust-cache 才能把缓存恢复进去。
      # 命中后可从「700+ crate 全量编译 ~20 分钟」降到「只编改动部分 ~3 分钟」。
      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "build/src-tauri -> target"
          key: ${{ matrix.platform }}

      - name: ② 验证：功能断言（42 条）
        shell: pwsh
        run: ./checks/feature-checks.ps1 -TargetDir "${{ github.workspace }}/build"

      - name: ③ 安装前端依赖
        working-directory: ${{ github.workspace }}/build
        run: pnpm install --frozen-lockfile

      - name: macOS 补 universal 目标（Intel + Apple Silicon）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          # 仓库里的 rust-toolchain.toml 钉了某个 channel（如 1.95），
          # 而 dtolnay/rust-toolchain@stable 装的是 stable —— 两套工具链。
          # 不知道构建最终用哪套，所以两套都装，避免「装了但没用上」。
          CH="$(sed -n 's/.*channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml | head -1)"
          echo "rust-toolchain.toml 钉的工具链: ${CH:-（无）}"
          for T in "$CH" stable; do
            [ -z "$T" ] && continue
            echo "== 为 $T 安装 target =="
            rustup target add --toolchain "$T" aarch64-apple-darwin || true
            rustup target add --toolchain "$T" x86_64-apple-darwin || true
            rustup target list --installed --toolchain "$T" || true
          done

      - name: ④ 打包（release + 安装包）
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            pnpm tauri build --target universal-apple-darwin --bundles ${{ matrix.bundles }}
          else
            pnpm tauri build --bundles ${{ matrix.bundles }}
          fi

      - name: ⑤ 收集并重命名（照官方命名规则）
        shell: pwsh
        run: |
          $tree = "${{ github.workspace }}/build"
          $out  = "${{ runner.temp }}/out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = (Get-Content "$tree/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          }
          $plat = "${{ matrix.platform }}"

          if ($plat -eq "Windows") {
            $exe = Get-ChildItem "$tree/src-tauri/target/release" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -notmatch "setup|uninstall" } | Select-Object -First 1
            if ($exe) {
              $pd = Join-Path $out "portable"
              New-Item -ItemType Directory -Force -Path $pd | Out-Null
              Copy-Item $exe.FullName (Join-Path $pd "CC-Switch-Magic.exe") -Force
              Compress-Archive -Path $pd -DestinationPath "$out/CC-Switch-Magic-$v-$plat-Portable.zip" -Force
              [System.IO.Directory]::Delete($pd, $true)
              Write-Host "便携版: CC-Switch-Magic-$v-$plat-Portable.zip"
            }
          }

          $bundle = "$tree/src-tauri/target/release/bundle"
          if (-not (Test-Path $bundle)) { $bundle = "$tree/src-tauri/target/universal-apple-darwin/release/bundle" }
          $i = 0
          Get-ChildItem $bundle -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in @(".msi", ".exe", ".dmg", ".deb", ".AppImage", ".rpm") } |
            Where-Object { $_.Name -notmatch "uninstall" } |
            ForEach-Object {
              $suffix = switch ($_.Extension) {
                ".msi"      { "$plat.msi" }
                ".exe"      { "$plat-Setup.exe" }
                ".dmg"      { "$plat.dmg" }
                ".deb"      { "$plat.deb" }
                ".rpm"      { "$plat.rpm" }
                ".AppImage" { "$plat.AppImage" }
              }
              $dest = "$out/CC-Switch-Magic-$v-$suffix"
              if (Test-Path $dest) { $dest = "$out/CC-Switch-Magic-$v-$suffix.$i"; $i++ }
              Copy-Item $_.FullName $dest -Force
              Write-Host "产物: $(Split-Path $dest -Leaf)  ($([math]::Round((Get-Item $dest).Length/1MB,1)) MB)"
            }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-magic-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: ${{ inputs.make_release || startsWith(github.ref, 'refs/tags/magic-') }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true

      - name: 创建 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ls -lh all
          TAG="magic-${{ inputs.version }}-$(date +%Y%m%d-%H%M)"
          if [ -z "${{ inputs.version }}" ]; then TAG="magic-$(date +%Y%m%d-%H%M)"; fi
          gh release create "$TAG" all/* \
            --repo "${{ github.repository }}" \
            --title "CC Switch Magic $TAG" \
            --notes "由补丁层自动构建（官方 ${{ inputs.version }}）"
