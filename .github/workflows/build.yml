name: Build CC Switch Magic

# 触发：
#   ① 仓库页面 → Actions → Build CC Switch Magic → Run workflow（手填官方 tag）
#   ② 推 tag 即出包 —— 官方 tag 形如 v3.20.3，我们的 tag 是 v3.20.3-Magic，
#      官方版本号直接从 tag 名剥掉后缀得到，不用另外传参。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "官方 tag（如 v3.20.1）。留空 = base.json 锁定的版本"
        required: false
        default: ""
        type: string
      make_release:
        description: "构建成功后创建 GitHub Release 并附上全部产物"
        required: false
        default: false
        type: boolean
      platforms:
        description: "构建哪些平台：全部 / Windows / Linux / macOS（可选多个，逗号分隔）"
        required: false
        default: "全部"
        type: string
  push:
    tags: ["*-Magic", "*-magic", "magic-*"]

permissions:
  contents: write

jobs:
  # 先算出「构建哪些平台」的矩阵 + 「对应哪个官方版本」。
  # 为什么单开一个 job：
  #   · GitHub 的 job 级 if 里不能用 matrix，只能在矩阵展开前过滤；
  #   · 版本号要能从 tag 名推出来，供下面所有步骤共用。
  plan:
    name: 规划
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          if [ -z "$V" ]; then
            # 由 tag 触发：v3.20.3-Magic → v3.20.3（也兼容 magic-v3.20.3 旧写法）
            REF='${{ github.ref_name }}'
            V="${REF%-Magic}"; V="${V%-magic}"; V="${V#magic-}"
          fi
          if [ -z "$V" ]; then echo "::error::解析不出官方版本号（ref=${{ github.ref_name }}）"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "官方版本: $V"
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          ALL='[{"os":"windows-latest","platform":"Windows","bundles":"nsis,msi"},{"os":"ubuntu-22.04","platform":"Linux","bundles":"deb,appimage"},{"os":"macos-14","platform":"macOS","bundles":"dmg"}]'
          SEL='${{ inputs.platforms }}'
          if [ -z "$SEL" ] || [ "$SEL" = "全部" ]; then
            MATRIX="$(echo "$ALL" | jq -c .)"
          else
            MATRIX="$(echo "$ALL" | jq -c --arg s "$SEL" '[.[] | select(.platform as $p | $s | contains($p))]')"
          fi
          echo "选中平台: $MATRIX"
          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # prepare：组装 + 验证 + 出源码快照 —— 只跑一次
  #
  # 为什么单开一个 job：
  #   · 组装结果【三平台完全相同】（源码一份，编译才分平台），没必要三台各跑一遍
  #   · 组装/验证是【源码层】的事，跟平台无关；编译才是平台的事
  #   · 源码快照天然是「组装」的产物，放在这里位置正确
  #   · 组装或验证挂了就不该往下编译 —— 出个半成品包更糟
  # ─────────────────────────────────────────────────────────────
  prepare:
    name: 打补丁
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ needs.plan.outputs.version }}
    steps:
      - name: 检出补丁层
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ① 组装：官方源码 + 补丁
        shell: pwsh
        run: |
          # 版本号来自 plan job（手填或从 tag 名解析），不再直接读 inputs.version ——
          # 推 tag 触发时 inputs 是空的，直接读会退回 base.json 的基线版本。
          $v = "${{ needs.plan.outputs.version }}"
          # 直接具名调用（已验证）。不用 @a 数组 splat——它只按位置传参，
          # 会把版本号当命令名执行（报 "The module 'v3.20.1' could not be loaded"）
          if ([string]::IsNullOrWhiteSpace($v)) {
            ./scripts/apply.ps1 -TargetDir "${{ github.workspace }}/build"
          } else {
            ./scripts/apply.ps1 -TargetDir "${{ github.workspace }}/build" -Version $v
          }

      - name: ② 验证：功能断言（44 条）
        shell: pwsh
        run: ./checks/feature-checks.ps1 -TargetDir "${{ github.workspace }}/build"

      # 打完补丁的源码本身就是一份「可直接开发」的完整仓库快照。
      # 以前它只存在于 runner 的临时目录里，构建完就销毁 —— 手里只有「diff」和
      # 「安装包」两个极端，中间那棵树是隐形的。现在把它作为产物发出去。
      - name: ③ 打包源码快照（浅克隆 .git，可直接续开发）
        shell: pwsh
        run: |
          $tree = "${{ github.workspace }}/build"
          $out  = "${{ runner.temp }}/out"
          $v = "${{ needs.plan.outputs.version }}"
          $stage = Join-Path $env:RUNNER_TEMP "snapshot"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # 溯源信息：让人知道这份快照怎么来的、怎么重建
          $patchSha = "${{ github.sha }}"
          $patchRef = "${{ github.ref_name }}"
          $offSha = (git -C $tree rev-parse --short HEAD 2>$null)
          $offTag = (git -C $tree describe --tags --exact-match 2>$null)
          $info = @"
          CC Switch Magic $v —— 源码快照
          ================================================

          官方上游 : farion1231/cc-switch @ $offTag ($offSha)
          补丁层   : Amengclass/cc-switch-patches @ $patchSha ($patchRef)
          组装方式 : scripts/apply.ps1 -Version $v
          构建时间 : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') UTC+8

          这份快照 = 官方源码 + 我们的补丁层，已组装完毕，可直接开发：
            pnpm install
            pnpm tauri dev          # 开发
            pnpm tauri build        # 出安装包

          它带一个【浅克隆】的 .git（只含当前这一个提交，无久远历史）：
            - 可以直接 commit / 开分支 / 继续开发
            - 想跟官方历史对齐，自己 `git fetch --unshallow` 或重新 clone 官方
            - 想只更新补丁层：改完功能后跑
                cc-switch-patches/scripts/repack.ps1 -EditedRepo <本目录> -Version $v
          "@
          [IO.File]::WriteAllText("$tree/BUILD-INFO.txt", $info, (New-Object Text.UTF8Encoding($false)))

          # 组装产物里没有 .git（apply.ps1 从官方 clone 拷的是工作区）。
          # 这里用【浅克隆】重建一个：只含当前快照这一个提交，体积从 ~120MB 降到 ~15MB，
          # 但 commit / 开分支 / 续开发都照常。
          if (Test-Path $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 排除构建产物 + 工具目录。
          # 关键：target / dist 是**嵌套**的（src-tauri/target），只过滤顶层拦不住 ——
          # 之前就是这样漏了 src-tauri/target，把源码快照从 65MB 撑到 1GB。
          # 这里改成「按路径段递归排除」：任何一层目录名命中就整棵跳过。
          $skipNames = @("node_modules", "target", "dist", ".vite", ".git", ".claude", ".reasonix")

          function Copy-Tree($src, $dst) {
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Get-ChildItem -LiteralPath $src -Force | ForEach-Object {
              if ($skipNames -contains $_.Name) { return }
              $target = Join-Path $dst $_.Name
              if ($_.PSIsContainer) { Copy-Tree $_.FullName $target }
              else { Copy-Item -LiteralPath $_.FullName -Destination $target -Force }
            }
          }
          Copy-Tree $tree $stage

          Push-Location $stage
          git init -q -b main
          git -c user.email="build@cc-switch-patches" -c user.name="cc-switch-patches CI" add -A
          git -c user.email="build@cc-switch-patches" -c user.name="cc-switch-patches CI" `
              commit -q -m "CC Switch Magic $v —— 官方 $offTag + 补丁层 $($patchSha.Substring(0,7))"
          Pop-Location
          Write-Host "快照文件数: $((Get-ChildItem $stage -Recurse -File -Force | Measure-Object).Count)"

          $zip = "$out/CC-Switch-Magic-$v-Source.zip"
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -Force
          $mb = [math]::Round((Get-Item $zip).Length/1MB,1)
          Write-Host "源码快照: $(Split-Path $zip -Leaf)  ($mb MB)"

          # 不另发 .sha256 文件：GitHub 会在 Release 附件右侧直接显示 sha256，
          # 而且它显示的是【GitHub 重新封装后】的哈希 —— 我们自己算的那个跟它对不上，
          # 发出去只会误导人（实测两者不同）。

      # 这一份源码【同时】干两件事：给三台编译用，以及作为对外的源码快照。
      # 以前拆成两份（assembled 无 .git / Source 带 .git），但内容几乎相同 ——
      # 实测 1308 vs 2760 文件，差的就是 .git 那 1452 个对象，压缩后体积还一样。
      # 合成一份：build 那三台多下 31MB（在 20 分钟编译面前可忽略），换来少一次打包。
      - name: ④ 上传源码（供编译 + 对外发布）
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-magic-Source
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  build:
    name: 编译 · ${{ matrix.platform }}
    needs: [plan, prepare]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev rpm \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: ① 取回组装好的源码
        uses: actions/download-artifact@v4
        with:
          name: cc-switch-magic-Source
          path: ${{ runner.temp }}/src

      - name: ② 解压到 build/
        shell: pwsh
        run: |
          $v = "${{ needs.plan.outputs.version }}"
          $zip = "${{ runner.temp }}/src/CC-Switch-Magic-$v-Source.zip"
          if (-not (Test-Path $zip)) {
            # 兜底：版本号解析异常时，按名字找一下
            $zip = (Get-ChildItem "${{ runner.temp }}/src" -Filter "*-Source.zip" | Select-Object -First 1).FullName
          }
          Write-Host "解压: $zip"
          $dst = "${{ github.workspace }}/build"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $dst -Force
          Write-Host "解压文件数: $((Get-ChildItem $dst -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object).Count)"
          Write-Host "工具链文件: $(Test-Path "$dst/rust-toolchain.toml")"
          Write-Host "Cargo.toml: $(Test-Path "$dst/src-tauri/Cargo.toml")"

      # 缓存 Rust 编译产物（关键优化）：必须放在源码就位之后，
      # 因为 target 目录要先存在，rust-cache 才能把缓存恢复进去。
      # 命中后可从「700+ crate 全量编译 ~20 分钟」降到「只编改动部分 ~3 分钟」。
      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "build/src-tauri -> target"
          key: ${{ matrix.platform }}

      - name: ③ 安装前端依赖
        working-directory: ${{ github.workspace }}/build
        run: pnpm install --frozen-lockfile

      # 关键：working-directory 必须是组装出来的 build/ ——
      # rust-toolchain.toml 在那里（钉了具体 channel，如 1.95），
      # 构建也在那里跑。在补丁层仓库根跑的话，rustup 读不到该文件，
      # 会把 target 装到 stable 上，而构建用的是 1.95 → 装了却没用上。
      - name: macOS 补 universal 目标（Intel + Apple Silicon）
        if: runner.os == 'macOS'
        shell: bash
        working-directory: ${{ github.workspace }}/build
        run: |
          set -euxo pipefail
          echo "== 本目录的工具链（读 rust-toolchain.toml）=="
          rustup show active-toolchain || true
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
          echo "== 已安装的 target =="
          rustup target list --installed

      - name: ④ 打包（release + 安装包）
        working-directory: ${{ github.workspace }}/build
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            pnpm tauri build --target universal-apple-darwin --bundles ${{ matrix.bundles }}
          else
            pnpm tauri build --bundles ${{ matrix.bundles }}
          fi

      - name: ⑤ 收集并重命名（照官方命名规则）
        shell: pwsh
        run: |
          $tree = "${{ github.workspace }}/build"
          $out  = "${{ runner.temp }}/out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $v = "${{ needs.plan.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = (Get-Content "$tree/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          }
          $plat = "${{ matrix.platform }}"

          if ($plat -eq "Windows") {
            $exe = Get-ChildItem "$tree/src-tauri/target/release" -Filter "*.exe" -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -notmatch "setup|uninstall" } | Select-Object -First 1
            if ($exe) {
              $pd = Join-Path $out "portable"
              New-Item -ItemType Directory -Force -Path $pd | Out-Null
              Copy-Item $exe.FullName (Join-Path $pd "CC-Switch-Magic.exe") -Force
              Compress-Archive -Path $pd -DestinationPath "$out/CC-Switch-Magic-$v-$plat-Portable.zip" -Force
              [System.IO.Directory]::Delete($pd, $true)
              Write-Host "便携版: CC-Switch-Magic-$v-$plat-Portable.zip"
            }
          }

          $bundle = "$tree/src-tauri/target/release/bundle"
          if (-not (Test-Path $bundle)) { $bundle = "$tree/src-tauri/target/universal-apple-darwin/release/bundle" }
          $i = 0
          Get-ChildItem $bundle -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in @(".msi", ".exe", ".dmg", ".deb", ".AppImage", ".rpm") } |
            Where-Object { $_.Name -notmatch "uninstall" } |
            ForEach-Object {
              $suffix = switch ($_.Extension) {
                ".msi"      { "$plat.msi" }
                ".exe"      { "$plat-Setup.exe" }
                ".dmg"      { "$plat.dmg" }
                ".deb"      { "$plat.deb" }
                ".rpm"      { "$plat.rpm" }
                ".AppImage" { "$plat.AppImage" }
              }
              $dest = "$out/CC-Switch-Magic-$v-$suffix"
              if (Test-Path $dest) { $dest = "$out/CC-Switch-Magic-$v-$suffix.$i"; $i++ }
              Copy-Item $_.FullName $dest -Force
              Write-Host "产物: $(Split-Path $dest -Leaf)  ($([math]::Round((Get-Item $dest).Length/1MB,1)) MB)"
            }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-magic-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [plan, prepare, build]
    # 手填 make_release，或推 tag 触发 —— 两种都出 Release
    if: ${{ inputs.make_release || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      # 需要 checkout：发布说明模板 .github/release-notes.md 在仓库里
      - name: 检出补丁层
        uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
          # 只要「安装包 + 源码快照」这两类对外产物。
          # cc-switch-magic-assembled 是 prepare→build 的内部中转，不该出现在 Release 里。
          pattern: "{cc-switch-magic-Windows,cc-switch-magic-Linux,cc-switch-magic-macOS,cc-switch-magic-Source}"

      - name: 创建 / 更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ls -lh all
          VER='${{ needs.plan.outputs.version }}'
          SHA='${{ github.sha }}'
          RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          if [[ '${{ github.ref }}' == refs/tags/* ]]; then
            # 推 tag 触发：直接用那个 tag（形如 v3.20.3-Magic）
            TAG='${{ github.ref_name }}'
          else
            # 手动触发：自己造一个 (版本 + 时间戳)，避免与已有 tag 撞
            TAG="${VER}-Magic-$(date +%Y%m%d-%H%M)"
          fi
          echo "Release tag: $TAG（官方 $VER）"

          # 发布说明 = 仓库里的模板 + 占位符替换。
          # （模板里有反引号和竖线，直接写 heredoc 会被 YAML 缩进和 shell 展开坑到）
          sed "s|__VER__|${VER}|g; s|__SHA__|${SHA:0:7}|g; s|__RUN__|${RUN_URL}|g" \
            .github/release-notes.md > notes.md
          echo "--- 发布说明前 5 行 ---"; head -5 notes.md

          TITLE="CC Switch Magic ${VER}"   # VER 自带 v，别再拼一个 v
          REPO="${{ github.repository }}"

          # 判断 Release 是否已存在：**按 tag 在列表里找**，不用 `gh release view <tag>`。
          # 为什么：tag 被强推过之后，按 tag 查会 404（实测遇到），于是误判成「不存在」
          # → 走 create → tag 已被占用 → 失败。而重推 tag 是常态（每次改 CI 都重推）。
          if gh release list --repo "$REPO" --limit 200 --json tagName -q '.[].tagName' | grep -qx "$TAG"; then
            echo "Release 已存在（$TAG）→ 更新标题/说明，并补齐/覆盖产物"
            gh release edit "$TAG" --repo "$REPO" --title "$TITLE" --notes-file notes.md
            # --clobber：同名附件覆盖，缺的补上；已存在的其它附件不动
            gh release upload "$TAG" all/* --repo "$REPO" --clobber
          else
            echo "Release 不存在（$TAG）→ 新建"
            gh release create "$TAG" all/* --repo "$REPO" \
              --title "$TITLE" --notes-file notes.md
          fi
